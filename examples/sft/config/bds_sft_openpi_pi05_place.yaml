# pi0.5 LoRA SFT on the BDS VR_H5D place task only (left arm + left vacuum).
# Same recipe as bds_sft_openpi_pi05, trained on 20261019 teleop place success
# (149 episodes, 52306 frames) with its own norm stats.
#
# Usage:
#   CONFIG=bds_sft_openpi_pi05_place OPENPI_CONFIG=pi05_bds_vfe_sim_place_left \
#   ASSET_ID=bds/vfe_sim_place_success_1019 DATA2= \
#   DATA=/mnt/data/sftp/data/vla/data_sim_ac/20261019_VR_H5D_VFE_sim_teleop_place_success \
#   CUDA_VISIBLE_DEVICES=0 bash examples/sft/run_bds_sft.sh <exp_name>

defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    # run_bds_sft.sh overrides log_path/experiment_name to
    # /mnt/data/sftp/data/vla/vr_checkpoints/rlinf/<exp_name>
    log_path: "/mnt/data/sftp/data/vla/vr_checkpoints/rlinf/bds_sft_pi05_place_1019"
    project_name: rlinf-bds
    experiment_name: "bds_sft_pi05_place_1019"
    logger_backends: ["wandb", "tensorboard"]

  max_epochs: 20
  max_steps: -1
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths:
    - "/mnt/data/sftp/data/vla/data_sim_ac/20261019_VR_H5D_VFE_sim_teleop_place_success"
  # openpi samples frames t, t+2, ..., t+98 for each action chunk.
  action_stride: 2

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 64
  seed: 0

  model:
    precision: null
    # PyTorch pi0.5 base dir. Needs the converted pi05_base weights AND
    # bds/vfe_sim_place_success_1019/norm_stats.json (computed on the 1019 data).
    model_path: "/mnt/data/sftp/data/vla/vr_pretrained_checkpoints/pi05_base_pytorch"
    num_action_chunks: 50
    action_dim: 8
    add_value_head: False
    # peft LoRA; not identical to openpi's gemma_2b_lora / gemma_300m_lora variants.
    is_lora: True
    lora_rank: 16
    openpi:
      config_name: "pi05_bds_vfe_sim_place_left"
      detach_critic_input: True
      num_images_in_input: 2
      train_expert_only: False

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    # 20 epochs * (52306 frames / batch 64) ~= 16350 steps for the cosine schedule
    total_training_steps: 16350
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
