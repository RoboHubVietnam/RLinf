# RECAP stage 4 — CFG (advantage-conditioned) training for GR00T N1.7 on the
# RoboTwin bowls line (E026). Anchor = E023 SFT ckpt; demos-only train set with
# advantages_r1 (per the validated LIBERO phase-2 recipe: rollouts train the
# value critic, demos train the conditioned policy). Launch with the recipe
# overrides: actor.optim.lr=1.0e-4 runner.max_steps=5000 (README rule 1).
#
# Usage:
#   cd examples/recap/cfg
#   python train_cfg.py --config-name libero_cfg_gr00t_n1d7
#
# Prereqs:
#   - LeRobot rollout dataset at data.train_data_paths[*].dataset_path (RECAP #1-2)
#   - meta/advantages_{data.advantage_tag}.parquet in that dataset (RECAP #6)
#   - vla-rlft-n1d7 venv (Cosmos-Reason2-2B backbone)

defaults:
  - training_backend/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: robotwin-bowls
    experiment_name: "E046-cfg-embonly-cup1-rollouts"
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: 30000
  max_steps: 5000  # recipe (README rule 1); was -1 = unbounded
  val_check_interval: -1
  save_interval: 1000

data:
  num_workers: 8
  advantage_tag: "cup1"
  video_backend: "torchcodec"   # LIBERO videos are AV1; only torchcodec decodes them
  balance_dataset_weights: true
  seed: 42

  train_data_paths:
    # E045 FIX 2026-07-25: cond-SFT must train on ROLLOUTS (what the winning
    # LIBERO config does: n1d7_libero_rollouts), NOT on the demos the base was
    # already SFT'd on. Demos-only gave: no new information (re-heat of a
    # converged optimum -> 19pt forgetting) AND no advantage signal
    # (all-success demos force A~0; std 0.0046 = noise). Rollouts carry the
    # real success/failure contrast (E038: 57 succ / 40 fail, std 0.029).
    - dataset_path: "/data/datasets/robotwin_cups_rollouts_r1_lerobot"
      type: "sft"   # match the LIBERO winner verbatim; this field is inert in
                     # rlinf/data/lerobot_paths.py (only dataset_path is read,
                     # and only the FIRST entry -> no multi-dataset mixing here)
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 32
  seed: 0

  model:
    precision: bf16
    is_lora: false
    load_to_device: true
    model_path: "/data/checkpoints/robotwin_cups500_abs_ft/checkpoint-10000"
    backbone_model_path: "/data/checkpoints/Cosmos-Reason2-2B"
    model_type: "gr00t_n1d7_cfg"
    embodiment_tag: "new_embodiment"
    num_action_chunks: 16
    obs_converter_type: "libero"
    denoising_steps: 4
    # CFG / RECAP knobs
    advantage_cfg_dropout_prob: 0.3
    cfg_guidance_weight: 1.0
    positive_only_conditional: false
    # Conditioning injection site: "film" (advantage -> DiT temb/adaLN) or
    # "token" (append advantage token to cross-attention context). Ablation.
    conditioning: "film"
    # E046 2026-07-25: the ONLY change vs E045. Freeze every param except the
    # advantage embedding (gr00t_n1d7_cfg/__init__.py:143). Rationale: E043
    # (demos) and E045 (rollouts) both lost ~19-25pt vs the 62.1% base at
    # w=0.0, so the forgetting is caused by 5k action-head steps @1e-4 on ~100
    # episodes, NOT by the choice of dataset. With the head frozen the
    # unconditional (NULL) policy IS the loaded SFT policy by construction, so
    # w=0.0 must reproduce 62.1% and w=1.0 - w=0.0 isolates the conditioning
    # lever with zero forgetting confound. Everything else (data, lr, steps)
    # held identical to E045 so this is a clean single-variable ablation.
    train_advantage_embedding_only: true
    # N1.7 action-head config (Cosmos backbone frozen; only action head +
    # advantage embedding train). add_value_head False: CFG uses parquet
    # advantages, not a runtime value head.
    add_value_head: False
    # Full rl_head_config (the parent RL action head built in __init__ reads all
    # of these before the CFG head replaces it). Mirrors model/gr00t_n1d7.yaml.
    rl_head_config:
      joint_logprob: False
      noise_method: "flow_sde"
      ignore_last: False
      safe_get_logprob: False
      noise_anneal: False
      noise_params: [0.7, 0.3, 400]
      noise_level: 0.5
      action_noise_scale: 0.1
      add_value_head: False
      chunk_critic_input: False
      detach_critic_input: True
      disable_dropout: True
      use_vlm_value: False
      value_vlm_mode: "mean_token"
      padding_value: 570

  optim:
    # Conservative LR: on N1.5, RECAP CFG at lr=1e-5 DEGRADED the policy; lr~2e-6
    # preserved it. Start low for N1.7 and raise only if loss/SR warrant.
    lr: 1.0e-4  # FIXED 2026-07-25: was 2.0e-6 -> advantage embedding NEVER TRAINED (E032/E040 void, |POS-NULL|~0.005 vs 0.34 at 1e-4). README rule 1.
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: "cosine"
    lr_warmup_steps: 500
    total_training_steps: 5000
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # Frozen Cosmos backbone + trainable action head: use_orig_params=False trips
    # FSDP's flat-param view-inplace guard (same as N1.5).
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: fp32   # bf16 grad reduction produced NaN grad norms on N1.5
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
