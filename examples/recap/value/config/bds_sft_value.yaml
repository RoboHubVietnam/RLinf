# RECAP stage 2: value critic (SigLIP2 + Gemma3-270m) for the BDS VR_H5D pick task.
# Trained on demos + rollouts together, so it sees both successful and failed states.
#
# Pipeline: compute_returns_bds -> this config -> compute_advantages_bds -> bds_cfg_openpi
#
# Usage (single free GPU):
#   bash examples/recap/value/run_value_sft.sh bds_sft_value cluster.component_placement.actor=<gpu>

defaults:
  - model/value@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config/

cluster:
  num_nodes: 1
  component_placement:
    # Physical GPU index (RLinf ignores CUDA_VISIBLE_DEVICES); override with
    # cluster.component_placement.actor=<gpu>.
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "/mnt/data/sftp/data/vla/vr_checkpoints/rlinf/bds_value"
    project_name: rlinf-bds
    experiment_name: "bds_value_v1"
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: 30000
  max_steps: 3000
  val_check_interval: -1
  save_interval: 1000

data:
  # Loads meta/returns_{tag}.parquet written by compute_returns_bds.
  tag: "bds_v1"

  # Copies written by compute_returns_bds (originals are left untouched).
  train_data_paths:
    - dataset_path: "/mnt/data/sftp/data/locht1/workspace/recap_bds/20261012_VR_H5D_VFE_sim_teleop_pick_success_openpi_recap"
      type: "sft"
      weight: 1.0
    - dataset_path: "/mnt/data/sftp/data/locht1/workspace/recap_bds/20261006_VR_H5D_VFE_sim_teleop_pick_success_openpi_recap"
      type: "sft"
      weight: 1.0
    - dataset_path: "/mnt/data/sftp/data/locht1/workspace/recap_bds/20261006_VR_H5D_VFE_sim_infer_pick_fail_openpi_recap"
      type: "rollout"
      weight: 1.0
    - dataset_path: "/mnt/data/sftp/data/locht1/workspace/recap_bds/20261006_VR_H5D_VFE_sim_infer_pick_timeout_openpi_recap"
      type: "rollout"
      weight: 1.0

  eval_data_paths: []

  train_num_workers: 8
  eval_num_workers: 0
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false

  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 8
  robot_type: "bds"
  model_type: "pi05"

  # Returns span [-2580, 0] (failure_reward=-500 on the last rollout frame).
  return_min: -2580.0
  return_max: 0.0

  balance_weights: true
  seed: 42

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 0

  model:
    precision: bf16
    siglip_path: "/mnt/data/sftp/data/vla/vr_pretrained_checkpoints/siglip2-so400m-patch14-224"
    gemma3_path: "/mnt/data/sftp/data/vla/vr_pretrained_checkpoints/gemma-3-270m"
    tokenizer_path: "/mnt/data/sftp/data/vla/vr_pretrained_checkpoints/gemma-3-270m"
    freeze_vlm: false
    action_dim: 8
    action_horizon: 10

  optim:
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: "constant"
    lr_warmup_steps: 500
    total_training_steps: 3000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
