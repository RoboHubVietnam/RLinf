defaults:
- env/libero_10@env.train
- env/libero_10@env.eval
- model/gr00t@actor.model
- training_backend/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: libero_10_ppo_gr00t
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 100
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    precision: bf16
    is_lora: false
    load_to_device: true
    model_path: /path/to/RLinf-Gr00t-SFT-10
    backbone_model_path: /data/checkpoints/Cosmos-Reason2-2B
    model_type: gr00t_n1d7_cfg
    embodiment_tag: libero_sim
    num_action_chunks: 16
    obs_converter_type: libero
    denoising_steps: 4
    advantage_cfg_dropout_prob: 0.3
    cfg_guidance_weight: 1.0
    positive_only_conditional: false
    conditioning: film
    add_value_head: false
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params:
      - 0.7
      - 0.3
      - 400
      noise_level: 0.5
      action_noise_scale: 0.1
      add_value_head: false
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 570
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 128
  global_batch_size: 1024
  seed: 1234
  enable_offload: false
  model:
    precision: bf16
    is_lora: false
    load_to_device: true
    model_path: /path/to/RLinf-Gr00t-SFT-10
    backbone_model_path: /data/checkpoints/Cosmos-Reason2-2B
    model_type: gr00t_n1d7_cfg
    embodiment_tag: libero_sim
    num_action_chunks: 16
    obs_converter_type: libero
    denoising_steps: 4
    advantage_cfg_dropout_prob: 0.3
    cfg_guidance_weight: 1.0
    positive_only_conditional: false
    conditioning: film
    add_value_head: false
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params:
      - 0.7
      - 0.3
      - 400
      noise_level: 0.5
      action_noise_scale: 0.1
      add_value_head: false
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 570
  optim:
    lr: 2.0e-05
    value_lr: 2.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 2.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
